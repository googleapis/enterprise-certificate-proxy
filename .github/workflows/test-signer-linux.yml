name: Build and Test Signer Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Bootstrap SoftHSM Credentials
      run: ./scripts/softhsm_setup.sh

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26

    - name: Build
      working-directory: ./internal/signer/linux
      run: go build -v ./...

    - name: Test Signer
      working-directory: ./internal/signer/linux
      run: |
        SLOT_ID=$(pkcs11-tool --list-slots --module "/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so" | grep -Eo "0x[A-Fa-f0-9]+" | head -n 1)
        ECP_TEST_SLOT="$SLOT_ID" ECP_TEST_MODULE="/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so" go test -v ./...

    - name: Test Client
      working-directory: ./linux
      run: |
        SLOT_ID=$(pkcs11-tool --list-slots --module "/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so" | grep -Eo "0x[A-Fa-f0-9]+" | head -n 1)
        ECP_TEST_SLOT="$SLOT_ID" ECP_TEST_MODULE="/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so" go test -v ./...

    - name: Lint Signer
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: latest
        working-directory: ./internal/signer/linux
        args: --max-same-issues 0

    - name: Lint Client
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: latest
        working-directory: ./linux
        args: --max-same-issues 0

    - name: Create Binaries
      run: ./build/scripts/linux_amd64.sh

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: linux_amd64
        path: ./build/bin/linux_amd64/*
